name: CI

on:
  push:
    branches:
      - main
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    # Xcode 27 is currently provided by GitHub's macOS preview image.
    # Switch to the stable macOS label once Xcode 27 is generally available.
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      SCHEME: WishEarn
      PROJECT: WishEarn.xcodeproj
      SIMULATOR_NAME: iPhone 18 Pro
      XCODEGEN_VERSION: "2.46.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.2"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone|iOS" | head -40

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          sudo cp -R "$RUNNER_TEMP/xcodegen/xcodegen/bin" /usr/local/
          sudo cp -R "$RUNNER_TEMP/xcodegen/xcodegen/share" /usr/local/
          sudo chmod +x /usr/local/bin/xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project is in sync
        run: |
          if ! git diff --quiet -- "$PROJECT"; then
            echo "::error title=XcodeGen drift::The generated project differs from the committed project. Run xcodegen generate and commit the result."
            git diff --stat -- "$PROJECT"
            git diff -- "$PROJECT" | head -200
            exit 1
          fi

      - name: Resolve and boot simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | jq -r --arg name "$SIMULATOR_NAME" '
            .devices
            | to_entries
            | map(select(.key | test("iOS-")))
            | sort_by(.key)
            | reverse
            | .[]
            | .value[]
            | select(.name == $name)
            | .udid
          ' | head -1)

          if [ -z "$DEVICE_ID" ]; then
            echo "::error title=Simulator not found::No available simulator named ${SIMULATOR_NAME}."
            exit 1
          fi

          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "SIMULATOR_UDID=${DEVICE_ID}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/build.log

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/test.log

      - name: Write test summary
        if: always()
        run: |
          RESULT_BUNDLE="build/TestResults.xcresult"
          SUMMARY_FILE="build/test-summary.json"

          if [ ! -d "$RESULT_BUNDLE" ]; then
            {
              echo "### 测试结果"
              echo ""
              echo "未生成 xcresult，请查看 Test 步骤日志。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          xcrun xcresulttool get test-results summary \
            --path "$RESULT_BUNDLE" \
            --compact > "$SUMMARY_FILE"

          RESULT=$(jq -r '.result' "$SUMMARY_FILE")
          TOTAL=$(jq -r '.totalTestCount' "$SUMMARY_FILE")
          PASSED=$(jq -r '.passedTests' "$SUMMARY_FILE")
          FAILED=$(jq -r '.failedTests' "$SUMMARY_FILE")
          SKIPPED=$(jq -r '.skippedTests' "$SUMMARY_FILE")

          {
            echo "### 测试结果"
            echo ""
            echo "| 指标 | 数量 |"
            echo "| --- | ---: |"
            echo "| 结果 | \`${RESULT}\` |"
            echo "| 总数 | ${TOTAL} |"
            echo "| 通过 | ${PASSED} |"
            echo "| 失败 | ${FAILED} |"
            echo "| 跳过 | ${SKIPPED} |"
          } >> "$GITHUB_STEP_SUMMARY"

          FAILURES=$(jq -r '
            .testFailures[]? |
            "- `\(.targetName).\(.testName)`: \(.failureText)"
          ' "$SUMMARY_FILE")

          if [ -n "$FAILURES" ]; then
            {
              echo ""
              echo "#### 失败用例"
              echo ""
              echo "$FAILURES"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WishEarn-test-results
          path: |
            build/TestResults.xcresult
            build/test-summary.json
            build/build.log
            build/test.log
          if-no-files-found: warn
          retention-days: 14
