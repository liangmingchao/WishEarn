name: WishEarn

options:
  bundleIdPrefix: com.wishearn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # MVP 使用 Swift 5 语言模式，避免过早引入 Swift 6 严格并发约束。
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.15.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: WishEarn
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  WishEarn:
    type: application
    platform: iOS
    sources:
      - path: WishEarn
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        PRODUCT_NAME: WishEarn
        PRODUCT_BUNDLE_IDENTIFIER: com.wishearn.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES

  WishEarnTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WishEarnTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: WishEarn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wishearn.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WishEarn:
    build:
      targets:
        WishEarn: all
        WishEarnTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: WishEarnTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
